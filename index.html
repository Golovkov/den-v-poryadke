<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f6fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>День в порядке</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');
    :root{--ink:#202b3c;--muted:#738095;--paper:#fff;--bg:#f4f6f8;--purple:#4667c8;--lav:#edf1fb;--green:#37a982;--yellow:#f1bd55;--line:#e9edf1;--shadow:0 3px 14px rgba(28,43,66,.045)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}
    button,input{font:inherit}
    button{cursor:pointer;border:0}
    .app{max-width:1120px;margin:auto;padding:28px 28px 100px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:20px;letter-spacing:-.5px}
    .brand-mark{width:42px;height:42px;border-radius:15px;background:var(--purple);color:white;display:grid;place-items:center;font-size:22px;box-shadow:0 7px 16px #7464e855}
    .top-right{display:flex;align-items:center;gap:12px}
    .date-chip,.avatar{background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;color:#6d6e80}
    .avatar{width:42px;height:42px;padding:0;display:grid;place-items:center;background:#ffe3cd;font-size:20px}
    .heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px}
    .eyebrow{font-size:13px;font-weight:800;color:var(--purple);letter-spacing:.5px;text-transform:uppercase}
    .heading h1{font-size:34px;letter-spacing:-1.3px;line-height:1.1;margin:5px 0 0}
    .heading p{margin:8px 0 0;color:var(--muted);font-weight:700}
    .today-btn{border-radius:13px;background:white;padding:11px 16px;font-weight:800;color:var(--purple);box-shadow:var(--shadow)}
    .layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.9fr);gap:20px}
    .left,.right{display:flex;flex-direction:column;gap:20px}
    .card{background:var(--paper);border-radius:23px;padding:23px;box-shadow:var(--shadow)}
    .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .card-title{font-size:18px;font-weight:900;letter-spacing:-.3px}
    .card-sub{font-size:13px;color:var(--muted);font-weight:700}
    .link-btn{color:var(--purple);font-size:13px;font-weight:900;background:none;padding:7px}
    .progress-card{color:#fff;background:linear-gradient(125deg,#7869ea,#9688f4);padding:23px 25px;position:relative;overflow:hidden}
    .progress-card:after{content:'✦';position:absolute;right:26px;top:1px;font-size:84px;opacity:.12;transform:rotate(13deg)}
    .progress-top{display:flex;align-items:start;justify-content:space-between;position:relative;z-index:1}
    .progress-top h2{margin:0;font-size:20px}
    .progress-top p{margin:4px 0;color:#e4e0ff;font-weight:700}
    .points{font-size:23px;font-weight:900}
    .progress-bar{height:9px;border-radius:9px;background:#ffffff44;margin:19px 0 10px;overflow:hidden}
    .progress-fill{height:100%;background:#ffdc76;border-radius:9px;width:0%;transition:width .3s}
    .progress-bottom{display:flex;justify-content:space-between;color:#f0edff;font-size:12px;font-weight:800;position:relative;z-index:1}
    .schedule-list{display:flex;flex-direction:column}
    .event{display:grid;grid-template-columns:58px 14px minmax(0,1fr) auto auto;gap:12px;align-items:center;min-height:71px;position:relative}
    .event:not(:last-child):after{content:'';position:absolute;left:76px;top:44px;height:40px;width:2px;background:#eeeefa}
    .event-time{font-size:13px;font-weight:900;color:#77788c}
    .event-dot{width:11px;height:11px;border-radius:50%;z-index:1;background:var(--purple);box-shadow:0 0 0 4px #eeeaff}
    .event:nth-child(2) .event-dot{background:#43bf91;box-shadow:0 0 0 4px #e4f8ef}
    .event:nth-child(3) .event-dot{background:#ffb34c;box-shadow:0 0 0 4px #fff4df}
    .event:nth-child(4) .event-dot{background:#5daceb;box-shadow:0 0 0 4px #e8f4ff}
    .event:nth-child(5) .event-dot{background:#ee82aa;box-shadow:0 0 0 4px #fff0f5}
    .event-name{font-weight:900}
    .event-meta{color:var(--muted);font-size:12px;font-weight:700;margin-top:2px}
    .event-tag{font-size:11px;background:#f5f4fc;padding:6px 9px;border-radius:9px;color:#74738b;font-weight:800}
    .task-list{display:flex;flex-direction:column;gap:9px}
    .task{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:15px;transition:.2s}
    .task.done{background:#f8fcfa;border-color:#e2f6ed}
    .check{width:25px;height:25px;border-radius:8px;border:2px solid #ddddea;background:white;display:grid;place-items:center;flex:none;color:white;font-size:15
